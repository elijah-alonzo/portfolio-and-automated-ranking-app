services:
  app:
    build: .
    ports:
      - "8000:80"
    env_file: .env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/data/database.sqlite
    volumes:
      - data:/var/www/html/database/data
      - storage:/var/www/html/storage/app

volumes:
  data:
  storage:
